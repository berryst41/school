<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>4원칙 학급 운영 자료실</title>
<meta name="description" content="4원칙 학급 운영 자료(아침 멘트·중간놀이·목힘·인성교육)를 허용 코드를 받은 사람만 볼 수 있어요.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2f9e44">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<style>
:root{--bg:#f6f8f4;--card:#fff;--ink:#1f2a1f;--muted:#6b7a6b;--line:#dde5d9;--accent:#2f9e44;--accent-soft:#e6f4e9;--warn:#e03131}
@media (prefers-color-scheme:dark){:root{--bg:#141a15;--card:#1d251e;--ink:#e8efe8;--muted:#9aa89a;--line:#2e3a30;--accent:#51cf66;--accent-soft:#1f3324}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 100px}
header{display:flex;align-items:center;gap:10px;margin:6px 0 14px}
header h1{font-size:21px;margin:0;flex:1}
header .who{font-size:13px;color:var(--muted)}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:10px 14px;background:var(--accent-soft);color:var(--ink)}
button.main{background:var(--accent);color:#fff;font-weight:700}
button.ghost{background:none;border:1px solid var(--line)}
button.danger{background:none;color:var(--warn);border:1px solid var(--warn)}
input,select,textarea{font:inherit;width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
textarea{min-height:140px;resize:vertical}
label{display:block;font-weight:700;font-size:14px;margin:12px 0 5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.tabs button{white-space:nowrap}
.tabs button.on{background:var(--accent);color:#fff;font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.chips button{padding:6px 12px;font-size:14px;border-radius:99px}
.chips button.on{background:var(--accent);color:#fff}
.item{cursor:pointer}
.item h3{margin:0 0 4px;font-size:17px}
.meta{font-size:13px;color:var(--muted)}
.preview{margin-top:6px;color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.today-h{font-size:15px;color:var(--muted);margin:2px 0 10px}
.sec{font-size:18px;margin:18px 0 8px}
.empty{color:var(--muted);text-align:center;padding:28px 10px}
.body{white-space:pre-wrap;word-break:break-word;font-size:17px;line-height:1.75}
.links a{display:block;padding:11px 14px;margin-top:8px;border-radius:12px;background:var(--accent-soft);color:var(--ink);text-decoration:none;font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row > *{flex:1;min-width:0}
.row > button{flex:1 1 auto;white-space:nowrap}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));border-radius:99px;padding:14px 20px;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}
.modal.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
@media (min-width:700px){.modal{align-items:center}.sheet{border-radius:20px}}
.sheet h2{margin:0 0 4px;font-size:20px}
.member{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.member .n{flex:1;min-width:0}
.member code{font-size:15px;letter-spacing:1px}
.off{opacity:.5}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;display:none;z-index:20}
.gate{max-width:380px;margin:12vh auto 0;text-align:center}
.gate .big{font-size:54px}
.gate input{text-align:center;font-size:22px;letter-spacing:4px;text-transform:uppercase;margin:14px 0 10px}
.err{color:var(--warn);min-height:1.5em}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
// 자료는 봄바나나 Supabase의 cls_ 표에 있어요. 표는 잠겨 있고, 허용 코드를 넣어야 cls_ 함수가 꺼내 줘요.
const SUPABASE_URL = 'https://bmfihlddiyfeejrdrigm.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJtZmlobGRkaXlmZWVqcmRyaWdtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyNTUwNzIsImV4cCI6MjEwNjgzMTA3Mn0.8EHC-CI5fz0yg9hF2Cp0uSfI1dZuUz5yS-MUaAdcCbc';
const CODE_KEY = 'cls-code';
// 종류 이름은 구글 시트 칸에서 정해져요 (supabase/cls-sync/parse.js의 COLS)
const KINDS = ['아침멘트', '중간놀이', '목힘', '금요놀이', '단단마인드', '수업놀이', '교사마인드', '주간교육', '기타'];
const KIND_ICON = { 아침멘트: '🌅', 중간놀이: '🤸', 목힘: '🫠', 금요놀이: '💚', 단단마인드: '💪', 수업놀이: '🎲', 교사마인드: '🧑‍🏫', 주간교육: '📅', 기타: '📎' };
const KIND_LABEL = { 목힘: '목힘(특별활동)', 금요놀이: '금요 인성교육' };
const label = k => KIND_LABEL[k] || k;
const DAYS = ['일', '월', '화', '수', '목', '금', '토'];
// 요일마다 「오늘」에 보여 줄 종류
const TODAY_KINDS = { 월: ['아침멘트'], 화: ['아침멘트'], 수: ['아침멘트'], 목: ['아침멘트', '목힘'], 금: ['아침멘트'] };
// 요일과 상관없이 「오늘」 화면에 늘 "이번 주 ○○"로 보여 줄 종류
const WEEK_KINDS = ['중간놀이', '금요놀이'];
// 학년도 안에서 달 순서 (3월 → 2월)
const monthRank = m => m == null ? 99 : (m + 9) % 12;
const weekKey = i => i.year * 10000 + monthRank(i.month) * 100 + (i.week || 0);

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} }
};

async function rpc(name, args) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${name}`, {
    method: 'POST',
    headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(args)
  });
  const t = await r.text();
  if (!r.ok) {
    if (t.includes('denied')) { logout('허용 코드가 꺼졌거나 바뀌었어요.'); }
    throw new Error(t);
  }
  return t ? JSON.parse(t) : null;
}

function toast(msg) {
  const el = $('toast'); el.textContent = msg; el.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => el.style.display = 'none', 2000);
}
async function copy(text, msg = '복사했어요') {
  try { await navigator.clipboard.writeText(text); toast(msg); }
  catch { prompt('아래 글을 길게 눌러 복사하세요', text); }
}

const S = { code: null, me: null, items: [], tab: 'today', year: null, kind: null, q: '' };

// ── 들어가기 ─────────────────────────────
function gate(msg = '') {
  $('app').innerHTML = `
    <div class="gate">
      <div class="big">📚</div>
      <h1 style="font-size:22px;margin:6px 0">4원칙 학급 운영 자료실</h1>
      <div class="meta">받은 허용 코드를 넣어 주세요.</div>
      <input id="code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="코드">
      <div class="err" id="err">${esc(msg)}</div>
      <button class="main" style="width:100%" id="go">들어가기</button>
    </div>`;
  const go = async () => {
    const c = $('code').value.trim().toUpperCase();
    if (!c) return;
    $('go').disabled = true;
    try {
      const me = await rpc('cls_enter', { p_code: c });
      if (!me) { $('err').textContent = '맞지 않는 코드예요.'; return; }
      store.set(CODE_KEY, c); start(c, me);
    } catch { $('err').textContent = '연결이 안 돼요. 잠시 뒤 다시 해 주세요.'; }
    finally { if ($('go')) $('go').disabled = false; }
  };
  $('go').onclick = go;
  $('code').onkeydown = e => { if (e.key === 'Enter') go(); };
  $('code').focus();
}

function logout(msg) { store.set(CODE_KEY, null); S.code = null; closeModal(); gate(msg); }

async function start(code, me) {
  S.code = code; S.me = me;
  $('app').innerHTML = '<div class="empty">불러오는 중…</div>';
  await load();
  // 마지막으로 시트를 가져온 지 10분이 지났으면 서버가 새로 가져와요(아니면 바로 끝남)
  sync(false).catch(() => {});
}

async function sync(all) {
  const call = year => fetch(`${SUPABASE_URL}/functions/v1/cls-sync`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ code: S.code, year })
  }).then(r => r.json());
  const years = all ? yearsOf() : [null];
  const out = [];
  for (const y of years) out.push(await call(y));
  if (out.some(r => r.ok && !r.skipped)) await load();
  return out;
}

async function load() {
  S.items = await rpc('cls_list', { p_code: S.code }) || [];
  const years = yearsOf();
  if (!S.year || !years.includes(S.year)) S.year = years[0];
  render();
}

function yearsOf() {
  const now = new Date().getFullYear();
  return [...new Set([now, ...S.items.map(i => i.year)])].sort((a, b) => b - a);
}

// ── 화면 ─────────────────────────────
function render() {
  const tabs = [['today', '☀️ 오늘'], ['all', '📂 모아보기'], ...(S.me.admin ? [['people', '⚙️ 관리']] : [])];
  $('app').innerHTML = `
    <header>
      <h1>📚 4원칙 자료실</h1>
      <span class="who">${esc(S.me.name)}</span>
      <button class="ghost" id="out" style="padding:6px 10px;font-size:13px">나가기</button>
    </header>
    <div class="tabs">${tabs.map(([k, t]) => `<button data-tab="${k}" class="${S.tab === k ? 'on' : ''}">${t}</button>`).join('')}</div>
    <div id="view"></div>
    ${S.me.admin && S.tab !== 'people' ? '<button class="main fab" id="add">＋ 자료 추가</button>' : ''}`;
  $('out').onclick = () => { if (confirm('이 기기에서 나갈까요? 다시 들어오려면 코드가 필요해요.')) logout(); };
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; render(); });
  if ($('add')) $('add').onclick = () => editItem();
  ({ today: viewToday, all: viewAll, people: viewPeople })[S.tab]();
}

const metaOf = i => [i.year + '년', i.month ? i.month + '월' : '', i.week ? i.week + '주차' : '', i.day ? i.day + '요일' : '', i.date || ''].filter(Boolean).join(' · ');

function card(i) {
  return `<div class="card item" data-id="${i.id}">
    <div class="meta">${KIND_ICON[i.kind] || '📎'} ${esc(label(i.kind))} · ${esc(metaOf(i))}${i.links?.length ? ' · 🔗' + i.links.length : ''}</div>
    <h3>${esc(i.title)}</h3>
    ${i.body ? `<div class="preview">${esc(i.body)}</div>` : ''}
  </div>`;
}
function bindCards() {
  document.querySelectorAll('.item').forEach(el => el.onclick = () => openItem(S.items.find(i => i.id === el.dataset.id)));
}

function isoDay(d) { return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); }

function viewToday() {
  const now = new Date(), day = DAYS[now.getDay()], today = isoDay(now);
  const kinds = TODAY_KINDS[day];
  // "이번 주" = 올해 시트에서 가장 최근에 채운 주차
  const thisYear = S.items.filter(i => i.year === S.items.reduce((m, i) => Math.max(m, i.year), 0) && i.week);
  const latest = thisYear.reduce((m, i) => Math.max(m, weekKey(i)), 0);
  const week = thisYear.filter(i => weekKey(i) === latest);
  const w0 = week[0];
  let html = `<div class="today-h">${now.getMonth() + 1}월 ${now.getDate()}일 ${day}요일${w0 ? ` · 이번 주 = ${w0.month}월 ${w0.week}주차` : ''}</div>`;
  if (!kinds) {
    html += `<div class="card empty">주말이에요 😊<br>푹 쉬고, 다음 주 준비는 아래 이번 주 자료나 <b>모아보기</b>에서 해요.</div>`;
  }
  const shown = new Set();
  // 오늘의 ○○: 그날 요일 것 / 이번 주 ○○: 요일 상관없이 이번 주 것 전부 (중간놀이·금요 인성교육은 미리 준비하게 매일 보임)
  const sections = [...(kinds || []).map(k => [k, 'today']), ...WEEK_KINDS.map(k => [k, 'week'])];
  for (const [k, mode] of sections) {
    // 오늘 날짜로 정해 둔 것 → 이번 주 (오늘 요일) 것 → 이번 주 그 종류 → 그 종류의 가장 최근 것
    const ofKind = S.items.filter(i => i.kind === k);
    let pick = mode === 'today' ? ofKind.filter(i => i.date === today) : [];
    if (!pick.length && mode === 'today') pick = week.filter(i => i.kind === k && (!i.day || i.day === day));
    if (!pick.length) pick = week.filter(i => i.kind === k);
    let old = false;
    if (!pick.length && ofKind.length) {
      const last = ofKind.filter(i => mode === 'week' || !i.day || i.day === day).sort((a, b) => weekKey(b) - weekKey(a))[0];
      if (last) { pick = [last]; old = true; }
    }
    pick.forEach(i => shown.add(i.id));
    html += `<h2 class="sec">${KIND_ICON[k]} ${mode === 'today' ? '오늘의' : '이번 주'} ${label(k)}</h2>`;
    if (old) html += `<div class="meta" style="margin:-4px 0 8px">이번 주 자료가 아직 없어서 가장 최근 것을 보여 줘요.</div>`;
    html += pick.length ? pick.map(card).join('') : `<div class="card empty">아직 ${label(k)} 자료가 없어요.</div>`;
  }
  const rest = week.filter(i => !shown.has(i.id)).sort((a, b) => KINDS.indexOf(a.kind) - KINDS.indexOf(b.kind) || a.sort - b.sort);
  if (rest.length) {
    html += `<h2 class="sec">📅 이번 주 다른 자료</h2>` + rest.map(card).join('');
  }
  // 작년 이맘때: 같은 달 지난해 자료
  const ago = S.items.filter(i => i.year < (w0?.year || now.getFullYear()) && i.month === now.getMonth() + 1 && i.kind !== '아침멘트');
  if (ago.length) {
    const r = ago[Math.floor(Math.random() * ago.length)];
    html += `<h2 class="sec">🕰️ 작년 이맘때</h2>${card(r)}`;
  }
  $('view').innerHTML = html;
  bindCards();
}

function viewAll() {
  const years = yearsOf();
  const q = S.q.trim().toLowerCase();
  const list = S.items.filter(i => i.year === S.year && (!S.kind || i.kind === S.kind) &&
    (!q || [i.title, i.body, i.kind, i.day, ...(i.tags || [])].join(' ').toLowerCase().includes(q)))
    .sort((a, b) => weekKey(b) - weekKey(a) || (a.sort ?? 99) - (b.sort ?? 99));
  // 최근 주차부터, 주차마다 제목을 달아요
  let html = '', last = null;
  for (const i of list) {
    const h = i.month ? `${i.month}월${i.week ? ' ' + i.week + '주차' : ''}` : '그 밖의 자료';
    if (h !== last) { html += `<h2 class="sec">${esc(h)}</h2>`; last = h; }
    html += card(i);
  }
  $('view').innerHTML = `
    <input id="q" placeholder="🔍 찾기 (제목·내용·#태그)" value="${esc(S.q)}">
    <div class="chips">${years.map(y => `<button data-y="${y}" class="${y === S.year ? 'on' : ''}">${y}년</button>`).join('')}</div>
    <div class="chips">${['전체', ...KINDS].map(k => `<button data-k="${k}" class="${(S.kind || '전체') === k ? 'on' : ''}">${KIND_ICON[k] || ''} ${label(k)}</button>`).join('')}</div>
    <div class="meta">${list.length}개</div>
    <div id="list">${html || '<div class="empty">자료가 없어요.</div>'}</div>`;
  bindCards();
  const qi = $('q');
  qi.oninput = () => { S.q = qi.value; const pos = qi.selectionStart; viewAll(); $('q').focus(); $('q').setSelectionRange(pos, pos); };
  document.querySelectorAll('[data-y]').forEach(b => b.onclick = () => { S.year = +b.dataset.y; viewAll(); });
  document.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { S.kind = b.dataset.k === '전체' ? null : b.dataset.k; viewAll(); });
}

// ── 자료 보기·고치기 ─────────────────────────────
function openModal(html) { $('sheet').innerHTML = html; $('modal').classList.add('on'); $('sheet').scrollTop = 0; }
function closeModal() { $('modal').classList.remove('on'); }
$('modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };

// 본문 속 주소는 누를 수 있게
const linkify = s => esc(s).replace(/https?:\/\/[^\s<>"')]+/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);

function openItem(i) {
  openModal(`
    <div class="meta">${KIND_ICON[i.kind] || '📎'} ${esc(label(i.kind))} · ${esc(metaOf(i))}</div>
    <h2>${esc(i.title)}</h2>
    ${i.body ? `<div class="body" style="margin-top:12px">${linkify(i.body)}</div>` : ''}
    ${i.links?.length ? `<div class="links">${i.links.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">🔗 ${esc(l.name || '자료 열기')}</a>`).join('')}</div>` : ''}
    ${i.tags?.length ? `<div class="meta" style="margin-top:10px">${i.tags.map(t => `<a href="#" data-tag="${esc(t)}" style="color:inherit">#${esc(t)}</a>`).join(' ')}</div>` : ''}
    <div class="row" style="margin-top:18px">
      ${i.body ? '<button id="cp">📋 내용 복사</button>' : ''}
      ${S.me.admin ? (i.src ? '<button id="sh">📝 시트에서 고치기</button>' : '<button id="ed">✏️ 고치기</button>') : ''}
      <button class="ghost" id="cl">닫기</button>
    </div>`);
  if ($('cp')) $('cp').onclick = () => copy(i.body);
  if ($('ed')) $('ed').onclick = () => editItem(i);
  if ($('sh')) $('sh').onclick = () => openSheet(i.year);
  document.querySelectorAll('[data-tag]').forEach(a => a.onclick = e => {
    e.preventDefault(); closeModal(); S.tab = 'all'; S.year = i.year; S.kind = null; S.q = a.dataset.tag; render();
  });
  $('cl').onclick = closeModal;
}

// 시트 주소는 공개 저장소에 적지 않고, 관리자에게만 서버가 알려 줘요
async function openSheet(year) {
  const w = window.open('', '_blank');
  const info = await rpc('cls_sync_info', { p_code: S.code });
  const s = (info.sheets || []).find(x => x.year === year) || (info.sheets || [])[0];
  if (s) w.location = `https://docs.google.com/spreadsheets/d/${s.id}/edit`; else w.close();
}

// ── 멘트를 붙여 넣으면 태그를 보고 알아서 나누기 ─────────────────────────────
// 1) 먼저 아래 규칙(위에 있을수록 먼저) 2) 규칙에 없으면 기존 자료에서 그 태그가 가장 많이 쓰인 종류 3) 그래도 없으면 기타
const TAG_RULES = [
  ['아침멘트', ['아침멘트', '월밀', '월밀자료']],
  ['목힘', ['목힘', '수힘', '특별활동']],
  ['수업놀이', ['수업놀이1픽', '수업놀이', '수업놀이추천']],
  ['중간놀이', ['중간놀이', '짧은놀이', '수요일']],
  ['금요놀이', ['금요놀이', '금놀이', '인성놀이', '금요일', '교실놀이추천']],
  ['교사마인드', ['교사마인드']],
  ['주간교육', ['주간교육']],
  ['단단마인드', ['단단마인드']]
];
// 종류마다 하는 요일
const KIND_DAY = { 중간놀이: '수', 목힘: '목', 금요놀이: '금' };
const tagsOf = text => [...new Set((text.match(/#[^\s#]+/g) || []).map(t => t.slice(1)))];
const urlsOf = text => [...new Set(text.match(/https?:\/\/[^\s<>"')]+/g) || [])];
// 시트 가져오기(supabase/cls-sync/parse.js)와 같은 방식
function linkName(u) {
  if (/youtu\.?be/.test(u)) return '영상';
  if (/blog\.naver/.test(u)) return '블로그';
  if (/drive\.google|docs\.google/.test(u)) return '자료 파일';
  if (/padlet/.test(u)) return '패들렛';
  if (/canva/.test(u)) return '캔바';
  return '링크';
}
function bodyOf(text) {
  const lines = text.replace(/\r\n?/g, '\n').trim().split('\n');
  while (lines.length && /^\s*(#[^\s#]+\s*)*$/.test(lines[0])) lines.shift();
  return lines.join('\n').trim();
}

// kindPicked: 사람이 종류를 직접 골랐으면 그 종류에 맞춰 요일을 정함
function classify(text, kindPicked) {
  const tags = tagsOf(text);
  const has = t => tags.includes(t);
  let kind = kindPicked || null, why = '';
  if (!kind)
  for (const [k, words] of TAG_RULES) {
    const w = words.find(has);
    if (w) { kind = k; why = '#' + w; break; }
  }
  if (!kind) {
    // 기존 자료에서 태그마다 어느 종류에 많이 쓰였는지 세어 봄
    const score = {};
    for (const i of S.items) for (const t of i.tags || []) {
      if (has(t) && t !== '이종대왕' && !/주차/.test(t)) score[i.kind] = (score[i.kind] || 0) + 1;
    }
    const best = Object.entries(score).sort((a, b) => b[1] - a[1])[0];
    if (best) { kind = best[0]; why = '비슷한 태그가 쓰인 자료'; }
  }
  kind = kind || '기타';

  const now = new Date();
  const dayTag = tags.map(t => (t.match(/^(월|화|수|목|금)요일$/) || [])[1]).find(Boolean);
  let day = dayTag || KIND_DAY[kind] || '';
  if (!day && kind === '아침멘트') day = DAYS[now.getDay()].replace(/[토일]/, '월');

  // 주차: #34주차 태그 → 없으면 이번 주(올해 가장 최근 주차)
  const latest = S.items.filter(i => i.year === now.getFullYear() && i.week).sort((a, b) => weekKey(b) - weekKey(a))[0];
  const weekTag = tags.map(t => +((t.match(/^(\d+)(?:~\d+)?주차$/) || [])[1])).find(Boolean);
  const week = weekTag || latest?.week || '';
  const same = S.items.find(i => i.year === now.getFullYear() && i.week === week && i.month);
  const month = same?.month || now.getMonth() + 1;

  const body = bodyOf(text);
  const first = (body.match(/<([^<>\n]{2,40})>/) || [])[1] ||
    (body.split('\n').map(l => l.replace(/^["“'*■●▶\s-]+/, '').trim()).find(l => l && !/^https?:/.test(l)) || '');
  const plain = first.length > 42 ? first.slice(0, 40) + '…' : first;
  return { kind, why, day, week, month, year: now.getFullYear(), plain, title: titleFor(kind, week, day, plain), body, tags };
}
const titleFor = (kind, week, day, plain) => kind === '아침멘트' && week && day ? `${week}주차 ${day}요일 아침 멘트` : plain;

function editItem(i = {}) {
  const now = new Date();
  // 고칠 때는 태그를 맨 위 줄에 다시 붙여서 보여 줌
  const text = i.id ? ((i.tags || []).length ? i.tags.map(t => '#' + t).join(' ') + '\n\n' : '') + (i.body || '') : '';
  const extra = (i.links || []).filter(l => !(i.body || '').includes(l.url)).map(l => (l.name ? l.name + ' | ' : '') + l.url).join('\n');
  openModal(`
    <h2>${i.id ? '✏️ 자료 고치기' : '＋ 자료 추가'}</h2>
    <div class="meta">카톡 등에서 멘트를 <b>#태그까지 통째로</b> 붙여 넣으면 종류·요일·주차를 알아서 정해요. 아래에서 바꿀 수도 있어요.</div>
    <textarea id="f-text" style="min-height:200px;margin-top:10px" placeholder="#이종대왕 #목힘 #35주차&#10;&#10;여기에 멘트나 자료 설명을 붙여 넣으세요">${esc(text)}</textarea>
    <div class="card" id="f-guess" style="margin:10px 0 0;background:var(--accent-soft);border:0;padding:12px 14px;display:none"></div>
    <div class="row">
      <div><label>종류</label><select id="f-kind">${KINDS.map(k => `<option value="${k}" ${k === (i.kind || '아침멘트') ? 'selected' : ''}>${KIND_ICON[k]} ${label(k)}</option>`).join('')}</select></div>
      <div><label>요일</label><select id="f-day"><option value="">-</option>${['월', '화', '수', '목', '금'].map(d => `<option ${d === i.day ? 'selected' : ''}>${d}</option>`).join('')}</select></div>
    </div>
    <div class="row">
      <div><label>연도</label><input id="f-year" type="number" value="${i.year || now.getFullYear()}"></div>
      <div><label>월</label><input id="f-month" type="number" min="1" max="12" value="${i.month ?? ''}"></div>
      <div><label>주차</label><input id="f-week" type="number" min="1" value="${i.week ?? ''}"></div>
    </div>
    <label>제목</label><input id="f-title" value="${esc(i.title || '')}">
    <label>더 붙일 링크 (선택, 멘트 속 주소는 저절로 들어가요)</label>
    <textarea id="f-links" style="min-height:60px" placeholder="목힘 PPT | https://drive.google.com/...">${esc(extra)}</textarea>
    <div class="row" style="margin-top:18px">
      <button class="main" id="sv">저장</button>
      ${i.id ? '<button class="danger" id="dl">지우기</button>' : ''}
      <button class="ghost" id="cl">취소</button>
    </div>`);
  $('cl').onclick = closeModal;

  // 사람이 직접 바꾼 칸은 그대로 두고, 나머지만 멘트를 보고 채움
  const touched = new Set(i.id ? ['f-kind', 'f-day', 'f-year', 'f-month', 'f-week', 'f-title'] : []);
  ['f-kind', 'f-day', 'f-year', 'f-month', 'f-week', 'f-title'].forEach(id => $(id).addEventListener('input', () => touched.add(id)));
  const fill = () => {
    const t = $('f-text').value;
    if (!t.trim()) { $('f-guess').style.display = 'none'; return; }
    const g = classify(t, touched.has('f-kind') ? $('f-kind').value : null);
    const set = (id, v) => { if (!touched.has(id)) $(id).value = v ?? ''; };
    set('f-kind', g.kind); set('f-day', g.day); set('f-year', g.year); set('f-month', g.month); set('f-week', g.week);
    // 종류·주차·요일을 바꾸면 제목도 다시 (아침멘트 제목은 주차·요일로 만듦)
    const k = $('f-kind').value;
    if (!touched.has('f-title')) $('f-title').value = titleFor(k, $('f-week').value, $('f-day').value, g.plain);
    $('f-guess').style.display = 'block';
    $('f-guess').innerHTML = `🪄 <b>${KIND_ICON[k]} ${esc(label(k))}</b>${$('f-day').value ? ' · ' + $('f-day').value + '요일' : ''}${$('f-week').value ? ' · ' + $('f-week').value + '주차' : ''}로 넣을게요
      <div class="meta">${touched.has('f-kind') ? '직접 고른 종류예요' : g.why ? '찾은 근거: ' + esc(g.why) : '맞는 태그가 없어서 기타로 넣어요'}${urlsOf(t).length ? ` · 링크 ${urlsOf(t).length}개` : ''}</div>`;
  };
  $('f-text').addEventListener('input', fill);
  ['f-kind', 'f-day', 'f-week'].forEach(id => $(id).addEventListener('change', fill));
  if (!i.id) setTimeout(() => $('f-text').focus(), 50); else fill();

  $('sv').onclick = async () => {
    const t = $('f-text').value;
    const extraLinks = $('f-links').value.split('\n').map(s => s.trim()).filter(Boolean).map(s => {
      const m = s.split('|'); return m.length > 1 ? { name: m[0].trim(), url: m.slice(1).join('|').trim() } : { name: linkName(s), url: s };
    });
    const p = {
      id: i.id || null,
      year: +$('f-year').value || now.getFullYear(),
      month: $('f-month').value,
      kind: $('f-kind').value,
      week: $('f-week').value, day: $('f-day').value, date: i.date || '',
      title: $('f-title').value.trim(),
      body: bodyOf(t),
      links: [...urlsOf(t).map(url => ({ name: linkName(url), url })), ...extraLinks],
      tags: tagsOf(t)
    };
    if (!p.body) { toast('멘트를 붙여 넣어 주세요'); return; }
    if (!p.title) p.title = p.body.split('\n')[0].slice(0, 40);
    $('sv').disabled = true;
    try { await rpc('cls_save', { p_code: S.code, p }); closeModal(); toast('저장했어요'); S.year = p.year; await load(); }
    catch { toast('저장이 안 됐어요. 다시 해 주세요'); $('sv').disabled = false; }
  };
  if ($('dl')) $('dl').onclick = async () => {
    if (!confirm('이 자료를 지울까요? 되돌릴 수 없어요.')) return;
    try { await rpc('cls_delete', { p_code: S.code, p_id: i.id }); closeModal(); toast('지웠어요'); await load(); }
    catch { toast('지우기가 안 됐어요'); }
  };
}

// ── 허용 코드 관리 (관리자만) ─────────────────────────────
async function viewPeople() {
  $('view').innerHTML = '<div class="empty">불러오는 중…</div>';
  const [list, info] = await Promise.all([rpc('cls_members_list', { p_code: S.code }), rpc('cls_sync_info', { p_code: S.code })]);
  const link = location.origin + location.pathname;
  $('view').innerHTML = `
    <div class="card">
      <b>📝 구글 시트에서 가져오기</b>
      <div class="meta">시트에 쓰면 자료실을 열 때 저절로 가져와요(10분에 한 번). 바로 보고 싶으면 아래 단추를 누르세요.<br>
        마지막: ${info.last_sync ? new Date(info.last_sync).toLocaleString('ko-KR') + ' · ' + esc(info.last_result || '') : '아직 없음'}</div>
      <div class="row" style="margin-top:10px">
        <button class="main" id="sync">🔄 지금 가져오기</button>
        ${(info.sheets || []).map(s => `<button class="ghost" data-sheet="${s.year}">${s.year}년 시트 열기</button>`).join('')}
      </div>
    </div>
    <div class="card">
      <b>새 사람에게 코드 주기</b>
      <div class="meta">사람마다 다른 코드가 만들어져요. 끄면 그 사람만 바로 못 들어와요.</div>
      <div class="row" style="margin-top:10px"><input id="nm" placeholder="이름 (예: 이종대왕 선생님)"><button class="main" id="mk" style="flex:0 0 auto">만들기</button></div>
    </div>
    <div class="card">${list.map(m => `
      <div class="member ${m.active ? '' : 'off'}">
        <div class="n"><b>${esc(m.name)}</b>${m.is_admin ? ' 👑' : ''}<br>
          <code>${esc(m.code)}</code> <span class="meta">${m.last_seen ? '· 마지막 접속 ' + new Date(m.last_seen).toLocaleDateString('ko-KR') : '· 아직 안 들어옴'}</span></div>
        ${m.is_admin ? '' : `
          <button data-share="${esc(m.code)}" data-name="${esc(m.name)}" title="초대 글 복사">📋</button>
          <button data-tog="${esc(m.code)}" data-on="${m.active}">${m.active ? '끄기' : '켜기'}</button>
          <button class="danger" data-rm="${esc(m.code)}" data-name="${esc(m.name)}">삭제</button>`}
      </div>`).join('')}</div>`;
  $('sync').onclick = async () => {
    $('sync').disabled = true; $('sync').textContent = '가져오는 중… (1분쯤)';
    try {
      const out = await sync(true);
      toast(out.map(r => r.result || r.error || '').join(' / '));
    } catch { toast('가져오기가 안 됐어요'); }
    viewPeople();
  };
  document.querySelectorAll('[data-sheet]').forEach(b => b.onclick = () => openSheet(+b.dataset.sheet));
  const invite = (name, code) => `${name}, 4원칙 학급 운영 자료실이에요 📚\n${link}\n허용 코드: ${code}`;
  $('mk').onclick = async () => {
    const name = $('nm').value.trim();
    if (!name) { toast('이름을 써 주세요'); return; }
    let m;
    try { m = await rpc('cls_member_add', { p_code: S.code, p_name: name }); }
    catch { toast('코드를 못 만들었어요. 다시 해 주세요'); return; }
    await copy(invite(name, m.code), '코드를 만들고 초대 글을 복사했어요');
    viewPeople();
  };
  document.querySelectorAll('[data-share]').forEach(b => b.onclick = () => copy(invite(b.dataset.name, b.dataset.share), '초대 글을 복사했어요'));
  document.querySelectorAll('[data-tog]').forEach(b => b.onclick = async () => {
    await rpc('cls_member_set', { p_code: S.code, p_target: b.dataset.tog, p_active: b.dataset.on !== 'true' });
    viewPeople();
  });
  document.querySelectorAll('[data-rm]').forEach(b => b.onclick = async () => {
    if (!confirm(`${b.dataset.name}의 코드를 완전히 지울까요? 다시 주려면 새 코드를 만들어야 해요.`)) return;
    await rpc('cls_member_remove', { p_code: S.code, p_target: b.dataset.rm });
    viewPeople();
  });
}

// ── 시작 ─────────────────────────────
(async () => {
  const saved = store.get(CODE_KEY);
  if (!saved) return gate();
  try {
    const me = await rpc('cls_enter', { p_code: saved });
    me ? start(saved, me) : logout('허용 코드가 꺼졌거나 바뀌었어요.');
  } catch { gate('연결이 안 돼요. 잠시 뒤 다시 해 주세요.'); }
})();
</script>
