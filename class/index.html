<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>4원칙 학급 운영 자료실</title>
<meta name="description" content="4원칙 학급 운영 자료(아침 멘트·중간놀이·목힘·인성교육)를 허용 코드를 받은 사람만 볼 수 있어요.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2f9e44">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<style>
:root{--bg:#f6f8f4;--card:#fff;--ink:#1f2a1f;--muted:#6b7a6b;--line:#dde5d9;--accent:#2f9e44;--accent-soft:#e6f4e9;--warn:#e03131}
@media (prefers-color-scheme:dark){:root{--bg:#141a15;--card:#1d251e;--ink:#e8efe8;--muted:#9aa89a;--line:#2e3a30;--accent:#51cf66;--accent-soft:#1f3324}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 100px}
header{display:flex;align-items:center;gap:10px;margin:6px 0 14px}
header h1{font-size:21px;margin:0;flex:1}
header .who{font-size:13px;color:var(--muted)}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:10px 14px;background:var(--accent-soft);color:var(--ink)}
button.main{background:var(--accent);color:#fff;font-weight:700}
button.ghost{background:none;border:1px solid var(--line)}
button.danger{background:none;color:var(--warn);border:1px solid var(--warn)}
input,select,textarea{font:inherit;width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
textarea{min-height:140px;resize:vertical}
label{display:block;font-weight:700;font-size:14px;margin:12px 0 5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.tabs button{white-space:nowrap}
.tabs button.on{background:var(--accent);color:#fff;font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.chips button{padding:6px 12px;font-size:14px;border-radius:99px}
.chips button.on{background:var(--accent);color:#fff}
.item{cursor:pointer}
.item h3{margin:0 0 4px;font-size:17px}
.meta{font-size:13px;color:var(--muted)}
.preview{margin-top:6px;color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.today-h{font-size:15px;color:var(--muted);margin:2px 0 10px}
.sec{font-size:18px;margin:18px 0 8px}
.empty{color:var(--muted);text-align:center;padding:28px 10px}
.body{white-space:pre-wrap;word-break:break-word;font-size:17px;line-height:1.75}
.links a{display:block;padding:11px 14px;margin-top:8px;border-radius:12px;background:var(--accent-soft);color:var(--ink);text-decoration:none;font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row > *{flex:1;min-width:0}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));border-radius:99px;padding:14px 20px;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}
.modal.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
@media (min-width:700px){.modal{align-items:center}.sheet{border-radius:20px}}
.sheet h2{margin:0 0 4px;font-size:20px}
.member{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.member .n{flex:1;min-width:0}
.member code{font-size:15px;letter-spacing:1px}
.off{opacity:.5}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;display:none;z-index:20}
.gate{max-width:380px;margin:12vh auto 0;text-align:center}
.gate .big{font-size:54px}
.gate input{text-align:center;font-size:22px;letter-spacing:4px;text-transform:uppercase;margin:14px 0 10px}
.err{color:var(--warn);min-height:1.5em}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
// 자료는 봄바나나 Supabase의 cls_ 표에 있어요. 표는 잠겨 있고, 허용 코드를 넣어야 cls_ 함수가 꺼내 줘요.
const SUPABASE_URL = 'https://bmfihlddiyfeejrdrigm.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJtZmlobGRkaXlmZWVqcmRyaWdtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyNTUwNzIsImV4cCI6MjEwNjgzMTA3Mn0.8EHC-CI5fz0yg9hF2Cp0uSfI1dZuUz5yS-MUaAdcCbc';
const CODE_KEY = 'cls-code';
const KINDS = ['아침멘트', '중간놀이', '목힘', '인성교육', '수업놀이', '단단멘트', '기타'];
const KIND_ICON = { 아침멘트: '🌅', 중간놀이: '🤸', 목힘: '🫠', 인성교육: '💚', 수업놀이: '🎲', 단단멘트: '💪', 기타: '📎' };
const DAYS = ['일', '월', '화', '수', '목', '금', '토'];
// 요일마다 「오늘」에 보여 줄 종류
const TODAY_KINDS = { 월: ['아침멘트'], 화: ['아침멘트'], 수: ['아침멘트', '중간놀이'], 목: ['아침멘트', '목힘'], 금: ['아침멘트', '인성교육'] };

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} }
};

async function rpc(name, args) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${name}`, {
    method: 'POST',
    headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(args)
  });
  const t = await r.text();
  if (!r.ok) {
    if (t.includes('denied')) { logout('허용 코드가 꺼졌거나 바뀌었어요.'); }
    throw new Error(t);
  }
  return t ? JSON.parse(t) : null;
}

function toast(msg) {
  const el = $('toast'); el.textContent = msg; el.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => el.style.display = 'none', 2000);
}
async function copy(text, msg = '복사했어요') {
  try { await navigator.clipboard.writeText(text); toast(msg); }
  catch { prompt('아래 글을 길게 눌러 복사하세요', text); }
}

const S = { code: null, me: null, items: [], tab: 'today', year: null, kind: null, q: '' };

// ── 들어가기 ─────────────────────────────
function gate(msg = '') {
  $('app').innerHTML = `
    <div class="gate">
      <div class="big">📚</div>
      <h1 style="font-size:22px;margin:6px 0">4원칙 학급 운영 자료실</h1>
      <div class="meta">받은 허용 코드를 넣어 주세요.</div>
      <input id="code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="코드">
      <div class="err" id="err">${esc(msg)}</div>
      <button class="main" style="width:100%" id="go">들어가기</button>
    </div>`;
  const go = async () => {
    const c = $('code').value.trim().toUpperCase();
    if (!c) return;
    $('go').disabled = true;
    try {
      const me = await rpc('cls_enter', { p_code: c });
      if (!me) { $('err').textContent = '맞지 않는 코드예요.'; return; }
      store.set(CODE_KEY, c); start(c, me);
    } catch { $('err').textContent = '연결이 안 돼요. 잠시 뒤 다시 해 주세요.'; }
    finally { if ($('go')) $('go').disabled = false; }
  };
  $('go').onclick = go;
  $('code').onkeydown = e => { if (e.key === 'Enter') go(); };
  $('code').focus();
}

function logout(msg) { store.set(CODE_KEY, null); S.code = null; closeModal(); gate(msg); }

async function start(code, me) {
  S.code = code; S.me = me;
  $('app').innerHTML = '<div class="empty">불러오는 중…</div>';
  await load();
}

async function load() {
  S.items = await rpc('cls_list', { p_code: S.code }) || [];
  const years = yearsOf();
  if (!S.year || !years.includes(S.year)) S.year = years[0];
  render();
}

function yearsOf() {
  const now = new Date().getFullYear();
  return [...new Set([now, ...S.items.map(i => i.year)])].sort((a, b) => b - a);
}

// ── 화면 ─────────────────────────────
function render() {
  const tabs = [['today', '☀️ 오늘'], ['all', '📂 모아보기'], ...(S.me.admin ? [['people', '🔑 허용 코드']] : [])];
  $('app').innerHTML = `
    <header>
      <h1>📚 4원칙 자료실</h1>
      <span class="who">${esc(S.me.name)}</span>
      <button class="ghost" id="out" style="padding:6px 10px;font-size:13px">나가기</button>
    </header>
    <div class="tabs">${tabs.map(([k, t]) => `<button data-tab="${k}" class="${S.tab === k ? 'on' : ''}">${t}</button>`).join('')}</div>
    <div id="view"></div>
    ${S.me.admin && S.tab !== 'people' ? '<button class="main fab" id="add">＋ 자료 추가</button>' : ''}`;
  $('out').onclick = () => { if (confirm('이 기기에서 나갈까요? 다시 들어오려면 코드가 필요해요.')) logout(); };
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; render(); });
  if ($('add')) $('add').onclick = () => editItem();
  ({ today: viewToday, all: viewAll, people: viewPeople })[S.tab]();
}

function card(i) {
  const meta = [i.year + '년', i.week ? i.week + '주차' : '', i.day ? i.day + '요일' : '', i.date || ''].filter(Boolean).join(' · ');
  return `<div class="card item" data-id="${i.id}">
    <div class="meta">${KIND_ICON[i.kind] || '📎'} ${esc(i.kind)} · ${esc(meta)}${i.links?.length ? ' · 📎' + i.links.length : ''}</div>
    <h3>${esc(i.title)}</h3>
    ${i.body ? `<div class="preview">${esc(i.body)}</div>` : ''}
  </div>`;
}
function bindCards() {
  document.querySelectorAll('.item').forEach(el => el.onclick = () => openItem(S.items.find(i => i.id === el.dataset.id)));
}

function isoDay(d) { return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); }

function viewToday() {
  const now = new Date(), day = DAYS[now.getDay()], today = isoDay(now);
  const kinds = TODAY_KINDS[day];
  let html = `<div class="today-h">${now.getMonth() + 1}월 ${now.getDate()}일 ${day}요일</div>`;
  if (!kinds) {
    html += `<div class="card empty">주말이에요 😊<br>푹 쉬고, 틈틈이 <b>모아보기</b>에서 지난 자료를 둘러보세요.</div>`;
  }
  for (const k of kinds || []) {
    // 오늘 날짜로 정해 둔 것 → 같은 요일 것(아침멘트) → 그 종류 전체 순으로 골라요
    let pick = S.items.filter(i => i.kind === k && i.date === today);
    if (!pick.length && k === '아침멘트') pick = S.items.filter(i => i.kind === k && i.day === day && i.year === now.getFullYear());
    if (!pick.length && k === '아침멘트') pick = S.items.filter(i => i.kind === k && i.day === day);
    if (!pick.length) pick = S.items.filter(i => i.kind === k);
    html += `<h2 class="sec">${KIND_ICON[k]} 오늘의 ${k}</h2>`;
    html += pick.length ? pick.slice(0, 3).map(card).join('') + (pick.length > 3 ? `<button class="ghost" style="width:100%" data-more="${k}">${k} 더 보기 (${pick.length})</button>` : '')
                        : `<div class="card empty">아직 ${k} 자료가 없어요.</div>`;
  }
  const extra = S.items.filter(i => i.kind === '수업놀이' || i.kind === '단단멘트');
  if (extra.length) {
    const r = extra[Math.floor(Math.random() * extra.length)];
    html += `<h2 class="sec">🎁 오늘의 추천</h2>${card(r)}`;
  }
  $('view').innerHTML = html;
  bindCards();
  document.querySelectorAll('[data-more]').forEach(b => b.onclick = () => { S.tab = 'all'; S.kind = b.dataset.more; render(); });
}

function viewAll() {
  const years = yearsOf();
  const q = S.q.trim().toLowerCase();
  const list = S.items.filter(i => i.year === S.year && (!S.kind || i.kind === S.kind) &&
    (!q || [i.title, i.body, i.kind, i.day, ...(i.tags || [])].join(' ').toLowerCase().includes(q)));
  $('view').innerHTML = `
    <input id="q" placeholder="🔍 찾기 (제목·내용)" value="${esc(S.q)}">
    <div class="chips">${years.map(y => `<button data-y="${y}" class="${y === S.year ? 'on' : ''}">${y}년</button>`).join('')}</div>
    <div class="chips">${['전체', ...KINDS].map(k => `<button data-k="${k}" class="${(S.kind || '전체') === k ? 'on' : ''}">${KIND_ICON[k] || ''} ${k}</button>`).join('')}</div>
    <div id="list">${list.length ? list.map(card).join('') : '<div class="empty">자료가 없어요.</div>'}</div>`;
  bindCards();
  const qi = $('q');
  qi.oninput = () => { S.q = qi.value; const pos = qi.selectionStart; viewAll(); $('q').focus(); $('q').setSelectionRange(pos, pos); };
  document.querySelectorAll('[data-y]').forEach(b => b.onclick = () => { S.year = +b.dataset.y; viewAll(); });
  document.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { S.kind = b.dataset.k === '전체' ? null : b.dataset.k; viewAll(); });
}

// ── 자료 보기·고치기 ─────────────────────────────
function openModal(html) { $('sheet').innerHTML = html; $('modal').classList.add('on'); $('sheet').scrollTop = 0; }
function closeModal() { $('modal').classList.remove('on'); }
$('modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };

function openItem(i) {
  const meta = [i.year + '년', i.week ? i.week + '주차' : '', i.day ? i.day + '요일' : '', i.date || ''].filter(Boolean).join(' · ');
  openModal(`
    <div class="meta">${KIND_ICON[i.kind] || '📎'} ${esc(i.kind)} · ${esc(meta)}</div>
    <h2>${esc(i.title)}</h2>
    ${i.body ? `<div class="body" style="margin-top:12px">${esc(i.body)}</div>` : ''}
    ${i.links?.length ? `<div class="links">${i.links.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">📎 ${esc(l.name || '자료 열기')}</a>`).join('')}</div>` : ''}
    ${i.tags?.length ? `<div class="meta" style="margin-top:10px">${i.tags.map(t => '#' + esc(t)).join(' ')}</div>` : ''}
    <div class="row" style="margin-top:18px">
      ${i.body ? '<button id="cp">📋 내용 복사</button>' : ''}
      ${S.me.admin ? '<button id="ed">✏️ 고치기</button>' : ''}
      <button class="ghost" id="cl">닫기</button>
    </div>`);
  if ($('cp')) $('cp').onclick = () => copy(i.body);
  if ($('ed')) $('ed').onclick = () => editItem(i);
  $('cl').onclick = closeModal;
}

function editItem(i = {}) {
  const now = new Date();
  const links = (i.links || []).map(l => (l.name ? l.name + ' | ' : '') + l.url).join('\n');
  openModal(`
    <h2>${i.id ? '✏️ 자료 고치기' : '＋ 자료 추가'}</h2>
    <div class="row">
      <div><label>연도</label><input id="f-year" type="number" value="${i.year || now.getFullYear()}"></div>
      <div><label>종류</label><select id="f-kind">${KINDS.map(k => `<option ${k === (i.kind || S.kind || '아침멘트') ? 'selected' : ''}>${k}</option>`).join('')}</select></div>
    </div>
    <div class="row">
      <div><label>주차 (선택)</label><input id="f-week" type="number" min="1" value="${i.week ?? ''}"></div>
      <div><label>요일 (선택)</label><select id="f-day"><option value="">-</option>${['월', '화', '수', '목', '금'].map(d => `<option ${d === i.day ? 'selected' : ''}>${d}</option>`).join('')}</select></div>
    </div>
    <label>하는 날짜 (선택)</label><input id="f-date" type="date" value="${i.date || ''}">
    <label>제목</label><input id="f-title" value="${esc(i.title || '')}">
    <label>내용·멘트</label><textarea id="f-body">${esc(i.body || '')}</textarea>
    <label>자료 링크 (한 줄에 하나, "이름 | 주소"처럼 써도 돼요)</label>
    <textarea id="f-links" style="min-height:70px" placeholder="목힘 PPT | https://drive.google.com/...">${esc(links)}</textarea>
    <label>태그 (쉼표로 나눠요, 선택)</label><input id="f-tags" value="${esc((i.tags || []).join(', '))}">
    <div class="row" style="margin-top:18px">
      <button class="main" id="sv">저장</button>
      ${i.id ? '<button class="danger" id="dl">지우기</button>' : ''}
      <button class="ghost" id="cl">취소</button>
    </div>`);
  $('cl').onclick = closeModal;
  $('sv').onclick = async () => {
    const p = {
      id: i.id || null,
      year: +$('f-year').value || now.getFullYear(),
      kind: $('f-kind').value,
      week: $('f-week').value, day: $('f-day').value, date: $('f-date').value,
      title: $('f-title').value.trim(),
      body: $('f-body').value.trim(),
      links: $('f-links').value.split('\n').map(s => s.trim()).filter(Boolean).map(s => {
        const m = s.split('|'); return m.length > 1 ? { name: m[0].trim(), url: m.slice(1).join('|').trim() } : { name: '', url: s };
      }),
      tags: $('f-tags').value.split(',').map(s => s.trim()).filter(Boolean)
    };
    if (!p.title) { toast('제목을 써 주세요'); return; }
    $('sv').disabled = true;
    try { await rpc('cls_save', { p_code: S.code, p }); closeModal(); toast('저장했어요'); S.year = p.year; await load(); }
    catch { toast('저장이 안 됐어요. 다시 해 주세요'); $('sv').disabled = false; }
  };
  if ($('dl')) $('dl').onclick = async () => {
    if (!confirm('이 자료를 지울까요? 되돌릴 수 없어요.')) return;
    try { await rpc('cls_delete', { p_code: S.code, p_id: i.id }); closeModal(); toast('지웠어요'); await load(); }
    catch { toast('지우기가 안 됐어요'); }
  };
}

// ── 허용 코드 관리 (관리자만) ─────────────────────────────
async function viewPeople() {
  $('view').innerHTML = '<div class="empty">불러오는 중…</div>';
  const list = await rpc('cls_members_list', { p_code: S.code });
  const link = location.origin + location.pathname;
  $('view').innerHTML = `
    <div class="card">
      <b>새 사람에게 코드 주기</b>
      <div class="meta">사람마다 다른 코드가 만들어져요. 끄면 그 사람만 바로 못 들어와요.</div>
      <div class="row" style="margin-top:10px"><input id="nm" placeholder="이름 (예: 이종대왕 선생님)"><button class="main" id="mk" style="flex:0 0 auto">만들기</button></div>
    </div>
    <div class="card">${list.map(m => `
      <div class="member ${m.active ? '' : 'off'}">
        <div class="n"><b>${esc(m.name)}</b>${m.is_admin ? ' 👑' : ''}<br>
          <code>${esc(m.code)}</code> <span class="meta">${m.last_seen ? '· 마지막 접속 ' + new Date(m.last_seen).toLocaleDateString('ko-KR') : '· 아직 안 들어옴'}</span></div>
        ${m.is_admin ? '' : `
          <button data-share="${esc(m.code)}" data-name="${esc(m.name)}" title="초대 글 복사">📋</button>
          <button data-tog="${esc(m.code)}" data-on="${m.active}">${m.active ? '끄기' : '켜기'}</button>
          <button class="danger" data-rm="${esc(m.code)}" data-name="${esc(m.name)}">삭제</button>`}
      </div>`).join('')}</div>`;
  const invite = (name, code) => `${name}, 4원칙 학급 운영 자료실이에요 📚\n${link}\n허용 코드: ${code}`;
  $('mk').onclick = async () => {
    const name = $('nm').value.trim();
    if (!name) { toast('이름을 써 주세요'); return; }
    const m = await rpc('cls_member_add', { p_code: S.code, p_name: name });
    await copy(invite(name, m.code), '코드를 만들고 초대 글을 복사했어요');
    viewPeople();
  };
  document.querySelectorAll('[data-share]').forEach(b => b.onclick = () => copy(invite(b.dataset.name, b.dataset.share), '초대 글을 복사했어요'));
  document.querySelectorAll('[data-tog]').forEach(b => b.onclick = async () => {
    await rpc('cls_member_set', { p_code: S.code, p_target: b.dataset.tog, p_active: b.dataset.on !== 'true' });
    viewPeople();
  });
  document.querySelectorAll('[data-rm]').forEach(b => b.onclick = async () => {
    if (!confirm(`${b.dataset.name}의 코드를 완전히 지울까요? 다시 주려면 새 코드를 만들어야 해요.`)) return;
    await rpc('cls_member_remove', { p_code: S.code, p_target: b.dataset.rm });
    viewPeople();
  });
}

// ── 시작 ─────────────────────────────
(async () => {
  const saved = store.get(CODE_KEY);
  if (!saved) return gate();
  try {
    const me = await rpc('cls_enter', { p_code: saved });
    me ? start(saved, me) : logout('허용 코드가 꺼졌거나 바뀌었어요.');
  } catch { gate('연결이 안 돼요. 잠시 뒤 다시 해 주세요.'); }
})();
</script>
</body>
</html>
